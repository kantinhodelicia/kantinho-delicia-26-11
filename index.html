<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kantinho Delícia - Pizzaria em Cabo Verde</title>
    <meta name="description" content="Cardápio online de pizza e bebidas">
    <meta name="theme-color" content="#dc2626">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pizza-red': '#dc2626',
                        'pizza-orange': '#ea580c',
                        'pizza-yellow': '#fbbf24',
                        'gray-750': '#2d3748',
                        'xmas-green': '#166534',
                        'xmas-gold': '#FCD34D'
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                        'zoom-in': 'zoom-in 0.3s ease-out forwards',
                        'bounce-short': 'bounce-short 0.5s ease-in-out 1',
                        'pulse-highlight': 'pulse-highlight 1s ease-in-out 1',
                        'snow': 'snow 10s linear infinite',
                        'fade-in-section': 'fade-in-section 0.5s ease-out forwards',
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            -webkit-tap-highlight-color: transparent;
        }
        .font-crimson-text {
            font-family: 'Crimson Text', serif;
        }
        .font-christmas {
            font-family: 'Mountains of Christmas', serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #718096; 
        }
        @keyframes pulse-custom {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-pulse-custom {
            animation: pulse-custom 0.5s ease-in-out 3;
        }
        
        /* New Animations */
        @keyframes zoom-in {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.02); opacity: 1; border-color: #fbbf24; }
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-highlight {
            0% { background-color: rgba(220, 38, 38, 0.5); transform: scale(1.02); }
            50% { background-color: rgba(252, 211, 77, 0.2); transform: scale(1.02); }
            100% { background-color: #1f2937; transform: scale(1); }
        }
        @keyframes snow {
            0% { transform: translateY(-10px) translateX(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(100vh) translateX(20px) rotate(360deg); opacity: 0; }
        }
        @keyframes fade-in-section {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 1em;
            text-shadow: 0 0 5px #000;
            z-index: 9999;
            pointer-events: none;
            animation-name: snow;
        }
        .animate-zoom-in {
            animation: zoom-in 0.3s ease-out forwards;
        }
        .animate-bounce-short {
            animation: bounce-short 0.5s ease-in-out 1;
        }
        .animate-pulse-highlight {
            animation: pulse-highlight 1s ease-in-out 1;
        }
        .animate-fade-in-section {
            animation: fade-in-section 0.5s ease-out forwards;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
